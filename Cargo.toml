[workspace]
resolver = "3"
members = [
  "xtask",
  "src/*/*",
  "shared",
]
exclude = [
  "src/glim/box",
]

default-members = [ "xtask" ]

[workspace.package]
edition = "2024"
version = "0.0.0"

[workspace.dependencies]
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"

embassy-executor = { version = "0.10.0" }
embassy-time = { version = "0.5.1" }
embassy-futures = { version = "0.1.2" }
embassy-sync = "0.8.0"
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "tcp",
  "udp"
] }

edge-dhcp = "0.8.0"
edge-http = "0.8.0"
edge-nal = "0.7.0"
edge-nal-embassy = "0.9.0"

defmt = "1.1.1"
static_cell = "2.1.1"
panic-halt = "1.0.0"
panic-reset = "0.1.1"
fixed = "1.20.0"
