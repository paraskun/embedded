[package.metadata.xtask]
project = "cav"
part = "tx"
target = "riscv32imc-unknown-none-elf"
chip = "esp32c3"
order = 0

[package]
name = "cav-rx"
edition.workspace = true
version.workspace = true

[dependencies]
embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-net = { workspace = true }

esp-hal = { version = "1.2.2", features = ["esp32c3", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["esp32c3", "embassy", "esp-radio"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32c3", "wifi"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3"] }
esp-alloc = { version = "0.11.0", features = ["esp32c3", "global-allocator", "compat"] }
esp-backtrace = { version = "0.20.0", features = ["esp32c3", "panic-handler", "defmt"] }
esp-println = { version = "0.18.0", features = ["esp32c3", "defmt-espflash"] }

panic-halt = "0.2.0"
